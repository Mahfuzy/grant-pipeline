# Grants.gov public search2 API (no key). https://www.grants.gov/api
name: grants_gov
adapter: generic_api
base_url: https://www.grants.gov
source_type: api
schedule: "0 5 * * *"
enabled: true
terms_reviewed: true
notes: >
  Terms reviewed by the project owner (2026-09-21). robots.txt checked 2026-09-21:
  www.grants.gov is "Allow: /"; api.grants.gov returns 403 for robots.txt, which
  RFC 9309 treats as no restrictions. Only posted and forecasted opportunities.
  Search hits lack synopsis/amounts/eligibility, so details come from fetchOpportunity,
  which is only re-fetched when the hit changes or the snapshot is older than 7 days.
config:
  search:
    url: https://api.grants.gov/v1/api/search2
    method: POST
    body:
      oppStatuses: "forecasted|posted"
      sortBy: "openDate|desc"
  pagination:
    offset_param: startRecordNum
    size_param: rows
    page_size: 100
    location: body
    max_pages: 50
  results_path: data.oppHits
  total_path: data.hitCount
  id_field: id
  item_url: "https://www.grants.gov/search-results-detail/{id}"
  change_fields: [number, title, agencyCode, openDate, closeDate, oppStatus, docType, cfdaList]
  detail:
    url: https://api.grants.gov/v1/api/fetchOpportunity
    method: POST
    body:
      opportunityId: "{id}"
  refetch_unchanged_after_days: 7
  # Every response carries a fresh `token`, and some lists (e.g. applicantTypes) come
  # back in random order, so hash a canonical form.
  content_hash:
    mode: json
    exclude_keys: [token]
    sort_lists: true
